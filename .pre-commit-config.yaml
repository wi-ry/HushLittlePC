# Installing with `pre-commit install` sets up both of these hook types.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml

  # Same rule CI applies, but checked before the commit is created.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: dotnet-build
        name: Build .NET project
        entry: dotnet build HushLittlePC.csproj --configuration Release
        language: system
        files: \.(cs|csproj)$
        pass_filenames: false
      - id: dotnet-test
        name: Test .NET project
        entry: dotnet test tests/HushLittlePC.Tests.csproj --configuration Release
        language: system
        files: \.(cs|csproj)$
        pass_filenames: false
