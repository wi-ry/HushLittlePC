repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml

  - repo: local
    hooks:
      - id: dotnet-build
        name: Build .NET project
        entry: dotnet build HushLittlePC.csproj --configuration Release
        language: system
        files: \.(cs|csproj)$
        pass_filenames: false
      - id: dotnet-test
        name: Test .NET project
        entry: dotnet test tests/HushLittlePC.Tests.csproj --configuration Release
        language: system
        files: \.(cs|csproj)$
        pass_filenames: false
