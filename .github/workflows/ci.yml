name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded runs on the same PR/branch, but never cancel a run on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore solution
        run: dotnet restore HushLittlePC.sln

      - name: Verify formatting
        run: dotnet format HushLittlePC.sln --verify-no-changes --no-restore

      - name: Build solution
        run: dotnet build HushLittlePC.sln -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test tests/HushLittlePC.Tests.csproj -c Release --no-restore -warnaserror --logger "trx;LogFileName=HushLittlePC.Tests.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14

  smoke-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Publish portable application
        shell: pwsh
        run: |
          dotnet publish HushLittlePC.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o artifacts/smoke
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }

      - name: Test startup and single-instance behavior
        shell: pwsh
        run: ./tests/Integration/SmokeTest.ps1 -ExecutablePath artifacts/smoke/HushLittlePC.exe

      - name: Package WinUI MSIX
        shell: pwsh
        run: .github/scripts/package-msix.ps1 -Version "0.0.0" -Project "src/WinUI/HushLittlePC.WinUI.csproj" -OutputDir "artifacts/msix-ci"

      - name: Publish WinUI portable executable
        shell: pwsh
        run: |
          dotnet publish src/WinUI/HushLittlePC.WinUI.csproj -c Release -r win-x64 --self-contained true `
            -p:WindowsAppSDKSelfContained=true -p:EnableMsixTooling=true `
            -p:IncludeAllContentForSelfExtract=true -p:PublishSingleFile=true -o artifacts/winui
          if ($LASTEXITCODE -ne 0) { throw "WinUI publish failed with exit code $LASTEXITCODE" }

      - name: Test WinUI startup and single-instance behavior
        shell: pwsh
        run: ./tests/Integration/SmokeTest.ps1 -ExecutablePath artifacts/winui/HushLittlePC.WinUI.exe
