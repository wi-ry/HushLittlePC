version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - "/"
      - "/tests"
    schedule:
      interval: weekly
    groups:
      nuget-major:
        patterns:
          - "*"
        update-types:
          - "major"
      nuget-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
      nuget-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
      github-actions-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
      github-actions-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
    commit-message:
      prefix: "chore(deps)"
