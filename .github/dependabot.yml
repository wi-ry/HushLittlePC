version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - "/"
      - "/tests"
    schedule:
      interval: weekly
    groups:
      nuget-dependencies:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
